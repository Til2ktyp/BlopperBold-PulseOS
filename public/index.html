<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hub Display</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="aura-bg">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <div id="mode-toast">Modus: Semi</div>

    <div id="init-toast">
        <div class="init-toast-text">INITIALISIERE</div>
        <div class="init-toast-bar-container">
            <div class="init-toast-bar"></div>
        </div>
    </div>

    <div id="popup-container">
        <div id="timer-popup" class="popup-box">
            <div class="popup-label" id="timer-label-text">⏱️ Timer</div>
            <div class="popup-value" id="timer-display">00:00</div>
            <div class="timer-btn-container">
                <button class="timer-end-btn" onclick="localTimerReset()">Timer Beenden</button>
            </div>
        </div>
        <div id="stopwatch-popup" class="popup-box">
            <div class="popup-label">⏱️ Stoppuhr</div>
            <div class="popup-value" id="stopwatch-display">00:00.0</div>
        </div>
    </div>

    <div id="reminder-container">
        <div id="reminder-popup" class="reminder-box">
            <div class="reminder-lines"></div>
            <div class="reminder-inner-content">
                <div class="reminder-label" id="reminder-label-text">🔔 Reminder</div>
                <div class="reminder-text" id="reminder-content">Inhalt</div>
            </div>
        </div>
    </div>

    <!-- 🔆 BRIGHTNESS POPUP (iPhone-Style) -->
    <div id="brightness-popup" class="brightness-popup">
        <div class="brightness-popup-content">
            <div class="brightness-popup-icon">☀️</div>
            <div class="brightness-popup-slider-container">
                <input type="range" id="brightnessPopupSlider" min="0" max="100" value="50" class="brightness-popup-slider">
            </div>
            <div class="brightness-popup-value" id="brightnessPopupValue">50%</div>
        </div>
    </div>

    <video autoplay muted loop playsinline style="display: none;">
        <source src="16x16.mp4" type="video/mp4">
    </video>

    <div id="adhs-overlay">
        <div class="adhs-card">
            <div class="adhs-flash-bg"></div>
            <div class="adhs-content">
                <div class="adhs-title">!! Erinnerung !!</div>
                <div class="adhs-message" id="adhs-message-text">Aufstehen!</div>
                <button class="adhs-btn" onclick="closeAdhsPopup()">OK, GECHECKT!</button>
            </div>
        </div>
    </div>

    <!-- 🚀 LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">BlopperBold</div>
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
        </div>
    </div>

    <div id="idle-screen">
        <div id="clock">00:00</div>
        <div id="weather">Lade Wetter...</div>
    </div>

    <div id="spotify-widget" class="spotify-card">
      <img id="track-cover" src="" alt="Album Cover" onclick="openWidget('spotify')">
      <div class="track-info">
          <div id="track-source" class="track-source">Quelle: --</div>
          <h2 id="track-title">Songtitel</h2>
          <h3 id="track-artist">Interpret</h3>
          <div class="progress-bar-container">
              <div id="track-progress" class="progress-bar"></div>
          </div>
      </div>
      <div class="spotify-controls">
          <button class="spotify-control-btn" type="button" title="Vorheriger Song" data-spotify-previous-track>⏮</button>
          <button id="spotify-toggle-play" class="spotify-control-btn spotify-toggle-play" type="button" title="Play/Pause" data-spotify-toggle-play>⏯</button>
          <button class="spotify-control-btn" type="button" title="Nächster Song" data-spotify-next-track>⏭</button>
      </div>
      <div id="spotify-semi-countdown"></div>
    </div>

    <div id="widget-container">
        <div class="widget-slot" id="widget-slot-a"></div>
        <div class="widget-slot" id="widget-slot-b"></div>
    </div>

    <div id="status-bar">
        <div class="status-left">
            <span id="status-weather">☁️ --°C</span>
            <button id="status-back-btn" class="status-back-btn" onclick="closeWidget()" style="display: none;">← Zurück</button>
        </div>
        <div class="status-center" id="status-time">00:00</div>
        <div class="status-right" id="status-date">Mo, 25. Mai</div>
    </div>

    <!-- ⚙️ SETTINGS PANEL (Bottom Sheet) -->
    <div id="settings-panel">
        <div class="settings-overlay" onclick="toggleSettingsPanel()"></div>
        <div class="settings-sheet">
            <div class="settings-content">
                <!-- Helligkeit Links -->
                <div class="settings-section settings-brightness">
                    <button class="settings-btn settings-brightness-btn" id="brightness-btn" onclick="toggleBrightnessSlider()" title="Helligkeit">☀️</button>
                    <div class="brightness-slider-container" id="brightness-slider-container" style="display: none;">
                        <input type="range" id="panelBrightnessSlider" min="0" max="100" value="50" class="brightness-slider">
                        <div class="brightness-value" id="panelBrightnessValue">50%</div>
                    </div>
                <button class="settings-btn" onclick="closeWidget()">🏠 HOME</button>
                </div>

                <!-- Buttons Mitte -->
                <div class="settings-section settings-buttons">
                    <button class="settings-btn" onclick="openWidget('spotify')">🎵 Spotify</button>
                    <button class="settings-btn" onclick="openWidget('vim')">📝 Vim</button>
                    <button class="settings-btn" onclick="openWidget('calendar')">📅 Kalender</button>
                    <button class="settings-btn" onclick="openWidget('homeassistant')">⌂ Home Assistant</button>
                    <button class="settings-btn" onclick="window.location.href='http://192.168.178.96:3000/desktop-mode.html'">📅 Desktop-Mode</button>
                    <button class="settings-btn" onclick="openWidget('info')">ℹ️ Info</button>
                </div>

                <!-- Buttons Rechts -->
                <div class="settings-section settings-right-buttons">
                    <button class="settings-btn settings-reload-btn" id="reload-btn" onmousedown="startReloadTimer()" onmouseup="cancelReloadTimer()" onmouseleave="cancelReloadTimer()" ontouchstart="startReloadTimer()" ontouchend="cancelReloadTimer()">
                        <span class="reload-text">⟲</span>
                        <span class="reload-progress" id="reload-progress"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="spotify.js"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
