<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hub Display</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --font-apple: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(40px);
            --clock-size: 11rem;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-apple);
            background: #090a0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 🌙 STANDBY MODUS STYLES --- */
        
        /* 1. Hintergrund komplett schwarz schalten & Aura unsichtbar machen */
        body.standby-active {
            background-color: #000000 !important;
            background-image: none !important; /* Entfernt eventuelle Hintergrund-Verläufe */
        }
        
        body.standby-active .aura-bg {
            opacity: 0 !important;
            visibility: hidden !important; /* Erzwingt, dass die Aura komplett verschwindet */
            filter: blur(0px); 
        }
        
        /* 2. Wetter-Widget rausfaden mit Zoom-Out */
        body.standby-active #weather {
            opacity: 0 !important;
            transform: scale(0.7);
            pointer-events: none;
        }
        
        /* 3. Uhr verkleinern, auf 60% Opacity setzen und leicht nach unten schieben */
        body.standby-active #clock {
            font-size: calc(var(--clock-size) * 0.85) !important;
            opacity: 0.4 !important;
            transform: translateY(20px);
        }
        
        /* 4. Übergänge für die Elemente geschmeidig machen */
        body, #clock, #weather, .aura-bg {
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
      
        /* --- AURA HINTERGRUND --- */
        .aura-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            filter: blur(80px);
            opacity: 0.85;
            transition: filter 0.8s ease;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: moveBlob 25s infinite alternate ease-in-out;
        }

        .blob1 { top: -10%; left: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, #1e3a8a 0%, transparent 70%); }
        .blob2 { bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: radial-gradient(circle, #581c87 0%, transparent 70%); animation-duration: 30s; }
        .blob3 { top: 30%; left: 40%; width: 45vw; height: 45vw; background: radial-gradient(circle, #0369a1 0%, transparent 70%); animation-duration: 20s; }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15vw, 10vh) scale(1.2); }
        }

        /* --- POPUPS OBEN LINKS --- */
        #popup-container {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 16px;
            z-index: 100;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15);
        }

        .popup-box {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 190px; 
            padding: 15px;
            display: none;
            opacity: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body.widget-active #popup-container {
            top: 55px;
        }

        body.standby-active #popup-container {
            opacity: 0.4;
        }

        .popup-box.popup-show {
            display: block !important;
            animation: popupIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }

        .popup-box.popup-hide {
            display: block !important;
            animation: popupOut 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
        }

        /* 🚨 ALARM MODUS */
        .popup-box.timer-alarm {
            width: 550px !important;
            max-width: 90vw !important;
            padding: 35px 25px !important;
            border: 3px solid #ff4757 !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5) !important;
            animation: touchPulse 1s infinite ease-in-out !important;
        }
        
        .popup-box.timer-alarm .popup-label {
            font-size: 1.8rem !important;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.9);
        }

        .popup-box.timer-alarm .popup-value {
            font-size: 5.5rem !important;
            font-weight: 700 !important;
            font-family: monospace;
            margin: 25px 0;
            color: #ffffff !important;
            text-shadow: 0 0 25px rgba(255, 71, 87, 0.6) !important;
        }

        .popup-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, 0.4); font-weight: 700; text-align: center; margin-bottom: 2px; }
        .popup-value { font-size: 1.6rem; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }

        .timer-btn-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            display: flex;
            justify-content: center;
        }
        .popup-box.timer-alarm .timer-btn-container {
            max-height: 90px;
            margin-top: 15px;
        }
        
        .timer-end-btn {
            width: 100% !important;
            min-height: 75px;
            background: #ff4757;
            border: none;
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            transition: transform 0.1s ease, background 0.2s;
        }
        .timer-end-btn:active {
            transform: scale(0.97);
            background: #e03d4b;
        }

        /* --- 📱 STATUS BAR STYLE --- */
        #status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 11, 16, 0.4); /* Subtiler Hintergrund für bessere Lesbarkeit */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 9999;
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: -0.2px;
            
            /* Standardmäßig unsichtbar und nach oben verschoben */
            opacity: 0;
            transform: translateY(-40px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Wird sichtbar, wenn ein Widget offen ist */
        body.widget-active #status-bar {
            opacity: 1;
            transform: translateY(0);
        }

        body.standby-active #status-bar {
            opacity: 0.4
        }
        
        .status-center {
            font-weight: 600;
            color: #fff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Widget-Inhalt minimal nach unten verschieben, damit nichts von der Bar verdeckt wird */
        .widget-slot {
            padding-top: 70px !important; 
        }

        /* --- TO-DO WIDGET --- */
        .todo-widget-content {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }
        
        .widget-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .todo-list-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-height: 75vh;
            overflow-y: auto;
            padding: 10px 5px;
            scrollbar-width: none; 
        }
        .todo-list-container::-webkit-scrollbar {
            display: none;
        }
        
        .todo-item {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        
        .todo-item:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .todo-checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            color: transparent;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        
        .todo-text {
            font-size: 1.3rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.25s ease;
        }
        
        .todo-item.done {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .todo-item.done .todo-checkbox {
            background: #34a853;
            border-color: #34a853;
            color: #ffffff;
        }
        
        .todo-item.done .todo-text {
            text-decoration: line-through;
            opacity: 0.35;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .todo-empty {
            grid-column: 1 / -1;
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            width: 100%;
        }
        
        .todo-header .widget-title {
            margin-bottom: 0; 
        }
        
        .todo-clear-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        
        .todo-clear-btn:hover {
            background: rgba(255, 69, 58, 0.2);
            border-color: rgba(255, 69, 58, 0.4);
            color: #ff453a;
        }
        
        .todo-clear-btn:active {
            transform: scale(0.95);
        }

        body.standby-active .todo-list-container {
            opacity: 0.4
        }

        body.standby-active .todo-item  {
            opacity: 0.4
        }

        body.standby-active .todo-text {
            opacity: 0.4
        }

        body.standby-active .todo-header {
            opacity: 0.4
        }

        body.standby-active .widget-title {
            opacity: 0.4
        }      
      
        /* --- SPOTIFY STYLE (KOMPAKT & UNTEN RECHTS) --- */
        .spotify-card {
            display: flex;
            align-items: center;
            background: rgba(20, 20, 20, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 20px; 
            padding: 16px 20px; 
            gap: 20px;
            width: 380px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 90;
            transform: translateY(20px); 
        }

        body.standby-active .spotify-card {
            opacity: 0.2
        }
        
        .spotify-card.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        #track-cover {
            width: 70px; 
            height: 70px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            object-fit: cover;
        }
        
        .track-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: calc(100% - 90px); 
        }
        
        #track-title {
            font-size: 1.15rem; 
            font-weight: 700;
            color: #fff;
            margin: 0 0 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        #track-artist {
            font-size: 0.9rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            margin: 0 0 10px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 4px; 
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #1db954;
            border-radius: 2px;
            transition: width 0.4s linear;
        }

        /* ⏳ Semi-Modus Countdown Balken */
        #spotify-semi-countdown {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: #1db954;
            transform-origin: left;
            transform: scaleX(0);
            transition: none;
        }
      
        /* --- REMINDER COMPONENT --- */
        #reminder-container { position: absolute; top: 30px; right: 30px; z-index: 100; }
        .reminder-box { position: relative; width: 280px; padding: 16px 20px; display: none; opacity: 0; overflow: hidden; border-radius: 24px; }
        .reminder-box.lvl-1 { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .reminder-box.lvl-1.popup-show { display: block !important; animation: popupIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .reminder-box.lvl-1.popup-hide { display: block !important; animation: popupOut 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards; }
        .reminder-lines { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; z-index: 1; pointer-events: none; background-image: linear-gradient(45deg, rgba(56, 189, 248, 0.07) 25%, transparent 25%, transparent 50%, rgba(56, 189, 248, 0.07) 50%, rgba(56, 189, 248, 0.07) 75%, transparent 75%, transparent); background-size: 40px 40px; animation: moveLines 6s linear infinite; }
        .reminder-inner-content { position: relative; z-index: 2; }
        .reminder-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #38bdf8; font-weight: 800; margin-bottom: 6px; opacity: 0.4; }
        .reminder-text { font-size: 1.15rem; font-weight: 600; color: #ffffff; line-height: 1.35; opacity: 1; }
        .reminder-box.lvl-2 { background: rgba(10, 12, 22, 0.75); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 2px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 30px rgba(56, 189, 248, 0.35), 0 0 60px rgba(147, 51, 234, 0.25), 0 20px 40px rgba(0, 0, 0, 0.6); }
        .reminder-box.lvl-2.popup-show { display: block !important; animation: popupIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .reminder-box.lvl-2.popup-hide { display: block !important; animation: popupOut 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards; }

        body.standby-active #reminder-container, .reminder.box, .reminder-lines, .reminder-text {
            opacity: 0.4
        }
      
        /* --- STUFE 3 OVERLAY --- */
        #adhs-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(4, 5, 11, 0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; backdrop-filter: blur(25px); transition: opacity 0.25s ease; }
        #adhs-overlay.active { opacity: 1; pointer-events: auto; }
        .adhs-card { position: relative; width: 85vw; max-width: 650px; background: #000000; border: 4px solid #ff0055; border-radius: 40px; padding: 50px 40px; text-align: center; overflow: hidden; transform: scale(0.5) rotate(-10deg); box-shadow: 0 0 50px #ff0055, 0 0 120px #ff00aa, inset 0 0 30px rgba(255, 0, 85, 0.4); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4); }
        #adhs-overlay.active .adhs-card { transform: scale(1) rotate(0deg); animation: cardPulse 0.4s infinite alternate ease-in-out; }
        .adhs-flash-bg { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; z-index: 1; background-image: repeating-linear-gradient(-45deg, rgba(255, 0, 85, 0.15), rgba(255, 0, 85, 0.15) 20px, transparent 20px, transparent 40px); animation: adhsLines 1.5s linear infinite; }
        .adhs-content { position: relative; z-index: 5; }
        .adhs-title { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; color: #ff0055; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff00aa; margin-bottom: 15px; animation: textJitter 0.15s infinite; }
        .adhs-message { font-size: 2.5rem; font-weight: 800; color: #ffffff; line-height: 1.2; margin-bottom: 40px; text-shadow: 0 2px 20px rgba(255,255,255,0.6); }
        .adhs-btn { background: linear-gradient(135deg, #ff0055, #9333ea); border: none; border-radius: 50px; color: white; font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; padding: 20px 50px; cursor: pointer; outline: none; box-shadow: 0 0 25px #ff0055, 0 10px 30px rgba(0,0,0,0.5); transform: scale(1); transition: transform 0.1s ease; }
        .adhs-btn:active { transform: scale(0.92); }

        /* --- ANIMATIONS & IDLE --- */
        @keyframes cardPulse { 0% { box-shadow: 0 0 40px #ff0055, 0 0 100px #ff00aa; } 100% { box-shadow: 0 0 70px #00f0ff, 0 0 130px #ff0055; border-color: #00f0ff; } }
        @keyframes adhsLines { 0% { transform: translate(0, 0); } 100% { transform: translate(40px, 40px); } }
        @keyframes textJitter { 0% { transform: translate(0, 0); } 50% { transform: translate(-2px, 1px); color: #00f0ff; } 100% { transform: translate(2px, -1px); } }
        @keyframes popupIn { 0% { transform: scale(0.7) translateY(-20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes popupOut { 0% { transform: scale(1) translateY(0); opacity: 1; } 100% { transform: scale(0.8) translateY(-20px); opacity: 0; } }
        @keyframes moveLines { 0% { transform: translate(0, 0); } 100% { transform: translate(40px, -40px); } }
        
        @keyframes touchPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.6), 0 10px 30px rgba(0, 0, 0, 0.5); }
            70% { transform: scale(1.01); box-shadow: 0 0 0 25px rgba(255, 71, 87, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        #idle-screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; transition: transform 0.6s ease, filter 0.6s ease, opacity 0.5s ease; }
        #clock { font-size: var(--clock-size); font-weight: 500; letter-spacing: -3px; line-height: 1; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
        #weather { font-size: 2rem; font-weight: 400; color: rgba(255, 255, 255, 0.85); background: rgba(255, 255, 255, 0.05); padding: 8px 20px; border-radius: 30px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        #widget-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; opacity: 0; transform: scale(0.92); filter: blur(15px); transition: transform 0.6s ease, filter 0.6s ease, opacity 0.5s ease; }
        .widget-slot { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 11, 16, 0.25); backdrop-filter: var(--glass-blur); padding: 50px; overflow-y: auto; opacity: 0; transform: scale(0.95); filter: blur(10px); transition: transform 0.5s ease, filter 0.5s ease, opacity 0.4s ease; }
        .widget-slot.slot-active { opacity: 1; transform: scale(1); filter: blur(0px); }
        body.widget-active #idle-screen { transform: scale(1.08); filter: blur(20px); opacity: 0; }
        body.widget-active #widget-container { opacity: 1; pointer-events: auto; transform: scale(1); filter: blur(0px); }

        /* --- NATIVES SPOTIFY DASHBOARD WIDGET STYLE (FULLSCREEN) --- */
        .spotify-dashboard-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            height: 100%;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            color: #fff;
        }

        .spotify-dash-left {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .spotify-dash-right {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 00px 0;
            gap: 30px;
        }

        body.standby-active .spotify-dashboard-layout{
            opacity: 0.2
        }
      
        .dash-section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1db954;
            letter-spacing: -0.5px;
        }

        .top-tracks-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
            flex-grow: 1;
            scrollbar-width: none;
        }
        .top-tracks-list::-webkit-scrollbar { display: none; }

        .top-track-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid transparent;
        }
        .top-track-rank { font-size: 1.1rem; font-weight: 700; color: rgba(255,255,255,0.3); width: 25px; text-align: center; }
        .top-track-img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .top-track-meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .top-track-name { font-size: 1rem; font-weight: 600; text-overflow: ellipsis; overflow: hidden; }
        .top-track-artist { font-size: 0.85rem; color: rgba(255,255,255,0.5); text-overflow: ellipsis; overflow: hidden; }

        .dash-now-playing {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .dash-cover { width: 160px; height: 160px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); object-fit: cover; }
        .dash-meta { flex-grow: 1; }
        .dash-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 5px; letter-spacing: -1px; }
        .dash-artist { font-size: 1.3rem; color: rgba(255,255,255,0.6); margin-bottom: 25px; }

        .dash-timeline-container { display: flex; align-items: center; gap: 15px; width: 100%; }
        .dash-time-stamp { font-size: 0.9rem; font-weight: 500; color: rgba(255,255,255,0.4); font-family: monospace; width: 50px; }
        .dash-progress-bg { flex-grow: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .dash-progress-bar { height: 100%; width: 0%; background: #1db954; border-radius: 3px; transition: width 0.4s linear; }

        .dash-bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            height: 45%;
        }

        .dash-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        /* --- 🍞 TOAST NOTIFICATION STYLE --- */
        #mode-toast {
            position: fixed;
            top: -100px; /* Startet außerhalb des Bildschirms */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(29, 185, 84, 0.25); /* Spotify-Grün mit Transparenz */
            border: 1px solid rgba(29, 185, 84, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 99999; /* Immer ganz oben */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(29, 185, 84, 0.1);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2); /* Elastischer Reinslide-Effekt */
        }
        
        #mode-toast.toast-show {
            top: 30px; /* Rutscht ins Sichtfeld */
        }

        .queue-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-grow: 1; scrollbar-width: none; }
        .queue-list::-webkit-scrollbar { display: none; }
        .queue-item { display: flex; align-items: center; gap: 15px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .queue-meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div class="aura-bg">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <div id="mode-toast">Modus: Semi</div>

    <div id="popup-container">
        <div id="timer-popup" class="popup-box">
            <div class="popup-label" id="timer-label-text">⏱️ Timer</div>
            <div class="popup-value" id="timer-display">00:00</div>
            <div class="timer-btn-container">
                <button class="timer-end-btn" onclick="localTimerReset()">Timer Beenden</button>
            </div>
        </div>
        <div id="stopwatch-popup" class="popup-box">
            <div class="popup-label">⏱️ Stoppuhr</div>
            <div class="popup-value" id="stopwatch-display">00:00.0</div>
        </div>
    </div>

    <div id="reminder-container">
        <div id="reminder-popup" class="reminder-box">
            <div class="reminder-lines"></div>
            <div class="reminder-inner-content">
                <div class="reminder-label" id="reminder-label-text">🔔 Reminder</div>
                <div class="reminder-text" id="reminder-content">Inhalt</div>
            </div>
        </div>
    </div>

    <div id="adhs-overlay">
        <div class="adhs-card">
            <div class="adhs-flash-bg"></div>
            <div class="adhs-content">
                <div class="adhs-title">🚨 DRINGENDE WARNUNG 🚨</div>
                <div class="adhs-message" id="adhs-message-text">Aufstehen!</div>
                <button class="adhs-btn" onclick="closeAdhsPopup()">OK, GECHECKT!</button>
            </div>
        </div>
    </div>

    <div id="idle-screen">
        <div id="clock">00:00</div>
        <div id="weather">Lade Wetter...</div>
    </div>

    <div id="spotify-widget" class="spotify-card">
      <img id="track-cover" src="" alt="Album Cover">
      <div class="track-info">
          <h2 id="track-title">Songtitel</h2>
          <h3 id="track-artist">Interpret</h3>
          <div class="progress-bar-container">
              <div id="track-progress" class="progress-bar"></div>
          </div>
      </div>
      <div id="spotify-semi-countdown"></div>
    </div>

    <div id="widget-container">
        <div class="widget-slot" id="widget-slot-a"></div>
        <div class="widget-slot" id="widget-slot-b"></div>
    </div>

    <div id="status-bar">
        <div class="status-left" id="status-weather">☁️ --°C</div>
        <div class="status-center" id="status-time">00:00</div>
        <div class="status-right" id="status-date">Mo, 25. Mai</div>
    </div>
    <script>
        let idleTimeout;
        const IDLE_TIME = 5 * 60 * 1000;
        
        let lat = localStorage.getItem('hub-lat') || '53.5653';
        let lon = localStorage.getItem('hub-lon') || '11.3653';
        let locName = localStorage.getItem('hub-city') || 'Pampow';
        let clockSize = localStorage.getItem('hub-clock-size') || '11';

        document.documentElement.style.setProperty('--clock-size', clockSize + 'rem');

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            
            // Altes Idle-Screen Update
            document.getElementById('clock').textContent = timeStr;
            
            // NEU: Status-Bar Updates
            document.getElementById('status-time').textContent = timeStr;
            document.getElementById('status-date').textContent = now.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'short' }).replace('.', '');
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        async function fetchWeather() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                
                // Altes Idle-Screen Update
                document.getElementById('weather').innerHTML = `☁️ ${temp}°C · ${locName}`;
                
                // NEU: Status-Bar Update (Kompakt fürs iPhone-Feeling)
                document.getElementById('status-weather').innerHTML = `☁️ ${temp}°C`;
            } catch (e) { console.log("Wetter Fehler"); }
        }
        fetchWeather();
        setInterval(fetchWeather, 30 * 60 * 1000);

        // --- AUTARKE FRONTEND-ENGINE ---
        let timerInterval, timerTime = 0, timerRunning = false;
        let swInterval, swTime = 0, swRunning = false, swStartTime = 0;

        // 🧠 Semi-Modus & State Variablen für Spotify
        let lastTrackId = null;
        let spotifySemiTimeout = null;
        let isSpotifyForcedHidden = false; 

        let spotifyMode = 'immer';

        function formatTime(seconds) {
            const isNegative = seconds < 0;
            const absoluteSeconds = Math.abs(seconds);
            const m = Math.floor(absoluteSeconds / 60).toString().padStart(2, '0');
            const s = (absoluteSeconds % 60).toString().padStart(2, '0');
            return `${isNegative ? '-' : ''}${m}:${s}`;
        }

        function formatStopwatch(ms) {
            const m = Math.floor(ms / 60000).toString().padStart(2, '0');
            const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
            const d = Math.floor((ms % 1000) / 100);
            return `${m}:${s}.${d}`;
        }

        function formatMs(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function showPopup(elementId) {
            const el = document.getElementById(elementId);
            el.style.display = 'block';
            el.classList.remove('popup-hide');
            setTimeout(() => { el.classList.add('popup-show'); }, 10);
        }

        function hidePopup(elementId) {
            const el = document.getElementById(elementId);
            el.classList.remove('popup-show');
            el.classList.add('popup-hide');
            setTimeout(() => {
                if (el.classList.contains('popup-hide')) {
                    el.style.display = 'none';
                    el.classList.remove('popup-hide');
                }
            }, 300);
        }

        function toggleTodo(index) {
          fetch(`/todo/toggle?index=${index}`)
          .catch(e => console.error("To-Do Update Fehler:", e));
        }

        function clearDoneTodos(event) {
            event.stopPropagation(); 
            fetch('/todo/clear')
                .then(response => {
                    if (!response.ok) throw new Error('Server-Fehler beim Löschen');
                    console.log("Erledigte Items erfolgreich gelöscht.");
                })
                .catch(e => console.error("Fehler beim Aufräumen der Liste:", e));
        }

        function localTimerReset() {
            clearInterval(timerInterval);
            timerRunning = false;
            timerTime = 0;
            
            const tPopup = document.getElementById('timer-popup');
            tPopup.classList.remove('timer-alarm', 'popup-show');
            tPopup.classList.add('popup-hide');
            
            document.getElementById('timer-display').textContent = "00:00";
            document.getElementById('timer-label-text').textContent = "⏱️ Timer";
            
            setTimeout(() => {
                if (tPopup.classList.contains('popup-hide')) {
                    tPopup.style.display = 'none';
                    tPopup.classList.remove('popup-hide');
                }
            }, 300);

            fetch('/timer/reset').catch(e => console.error("Reset Fehler:", e));
        }

        function closeAdhsPopup() { document.getElementById('adhs-overlay').classList.remove('active'); }

        const eventSource = new EventSource('/events');
        let currentSlot = 'a';

        eventSource.onmessage = function(event) {
            try {
                // --- RELOAD HANDLER (vor JSON.parse!) ---
                if (event.data === 'reload') {
                    console.log('Server meldet Update. Schließe Event-Stream...');
                    eventSource.close(); 
                    console.log('Lade in 5 Sekunden neu...');
                    setTimeout(() => {
                        window.location.reload();
                    }, 5000);
                    return;
                }
                
                const data = JSON.parse(event.data);
                if (!data || !data.action) return; 

                // --- 🔥 STREAM DECK POPUP TOGGLE LOGIK ---
                if (data.action === 'toggle-popup') {
                    const target = data.target;

                    const toggleStandardPopup = (element, forceVisible) => {
                        if (!element) return;
                        if (forceVisible !== undefined) {
                            if (forceVisible) {
                                element.style.display = 'block';
                                setTimeout(() => { element.classList.remove('popup-hide'); element.classList.add('popup-show'); }, 10);
                            } else {
                                element.classList.remove('popup-show'); element.classList.add('popup-hide');
                                setTimeout(() => { if (element.classList.contains('popup-hide')) element.style.display = 'none'; }, 300);
                            }
                        } else {
                            if (element.style.display === 'none' || element.classList.contains('popup-hide') || !element.classList.contains('popup-show')) {
                                element.style.display = 'block';
                                setTimeout(() => { element.classList.remove('popup-hide'); element.classList.add('popup-show'); }, 10);
                            } else {
                                element.classList.remove('popup-show'); element.classList.add('popup-hide');
                                setTimeout(() => { if (element.classList.contains('popup-hide')) element.style.display = 'none'; }, 300);
                            }
                        }
                    };

                    if (target === 'alle') {
                        const isVisible = data.visible;
                        isSpotifyForcedHidden = !isVisible; 
                        toggleStandardPopup(document.getElementById('timer-popup'), isVisible);
                        toggleStandardPopup(document.getElementById('stopwatch-popup'), isVisible);
                        
                        const spotifyWidget = document.getElementById('spotify-widget');
                        if (!isVisible) {
                            spotifyWidget.classList.remove('active');
                            clearTimeout(spotifySemiTimeout);
                        }
                        
                        const todoWidget = document.querySelector('.todo-widget-content');
                        if (todoWidget && todoWidget.parentElement) {
                            todoWidget.parentElement.style.display = isVisible ? 'block' : 'none';
                        }
                    } 
                    else if (target === 'spotify') {
                        // REPARIERT: Falls gezielter Modus über Backend kommt, sonst umschalten (aus -> semi -> immer)
                        if (data.mode) {
                            spotifyMode = data.mode;
                            console.log("Spotify-Modus gesetzt auf:", spotifyMode);
                        } else {
                            if (spotifyMode === 'aus') {
                                spotifyMode = 'immer';
                                console.log("Spotify-Modus: IMMER");
                            } else if (spotifyMode === 'immer') {
                                spotifyMode = 'semi';
                                console.log("Spotify-Modus: SEMI (10s)");
                            } else {
                                spotifyMode = 'aus';
                                console.log("Spotify-Modus: AUS");
                            }
                        }
                        
                        // --- 🍞 TOAST TRIGER LOGIK ---
                        const toast = document.getElementById('mode-toast');
                        // Ersten Buchstaben groß machen für die Optik (semi -> Semi, immer -> Immer...)
                        const modeText = spotifyMode.charAt(0).toUpperCase() + spotifyMode.slice(1);
                        
                        // Text setzen (z.B. "🎵 Spotify: Immer")
                        toast.textContent = `🎵 Spotify: ${modeText === 'Aus' ? 'Aus' : modeText}`;
                        
                        // Timer zurücksetzen, falls der Button wild gespammt wird
                        if (window.toastTimeout) clearTimeout(window.toastTimeout);
                        
                        // Toast anzeigen
                        toast.classList.add('toast-show');
                        
                        // Nach 2.5 Sekunden wieder ausblenden
                        window.toastTimeout = setTimeout(() => {
                            toast.classList.remove('toast-show');
                        }, 2500);
                        // ------------------------------

                        // Sofortige visuelle Rückmeldung auf dem Display umsetzen
                        const spotifyWidget = document.getElementById('spotify-widget');
                        if (spotifyMode === 'aus') {
                            spotifyWidget.classList.remove('active');
                            clearTimeout(spotifySemiTimeout);
                        } else if (spotifyMode === 'immer') {
                            spotifyWidget.classList.add('active');
                            clearTimeout(spotifySemiTimeout);
                            document.getElementById('spotify-semi-countdown').style.transform = 'scaleX(0)';
                        } else if (spotifyMode === 'semi') {
                            lastTrackId = null; 
                            spotifyWidget.classList.remove('active');
                        }
                    }
                }

                                // --- SPOTIFY SSE LOGIK ---
                if (data.action === 'spotify-playing') {
                    document.getElementById('track-title').textContent = data.title;
                    document.getElementById('track-artist').textContent = data.artist;
                    document.getElementById('track-cover').src = data.albumImg;
                    
                    const progressPercent = (data.progress / data.duration) * 100;
                    document.getElementById('track-progress').style.width = `${progressPercent}%`;
                
                    const spotifyWidget = document.getElementById('spotify-widget');
                    const countdownBar = document.getElementById('spotify-semi-countdown');
                    const currentTrackIdentifier = data.title + data.artist;
                
                    // --- REPARIERTE MODUS LOGIK FÜR DAS POPUP (JETZT MIT POPUP-BLOCKER) ---
                    // Wenn der Modus aus ist, Spotify versteckt werden soll ODER ein großes Widget aktiv ist: AUS SCHALTEN
                    if (spotifyMode === 'aus' || isSpotifyForcedHidden || document.body.classList.contains('widget-active')) {
                        spotifyWidget.classList.remove('active');
                        clearTimeout(spotifySemiTimeout);
                    } 
                    else if (spotifyMode === 'immer') {
                        spotifyWidget.classList.add('active');
                        clearTimeout(spotifySemiTimeout);
                        countdownBar.style.transform = 'scaleX(0)'; 
                    } 
                    else if (spotifyMode === 'semi') {
                        if (currentTrackIdentifier !== lastTrackId) {
                            lastTrackId = currentTrackIdentifier;
                            
                            spotifyWidget.classList.add('active');
                            
                            countdownBar.style.transition = 'none';
                            countdownBar.style.transform = 'scaleX(1)';
                            
                            setTimeout(() => {
                                countdownBar.style.transition = 'transform 10s linear';
                                countdownBar.style.transform = 'scaleX(0)';
                            }, 50);
                
                            clearTimeout(spotifySemiTimeout);
                            spotifySemiTimeout = setTimeout(() => {
                                if (spotifyMode === 'semi') {
                                    spotifyWidget.classList.remove('active');
                                }
                            }, 10050);
                        }
                    }

                    // 🖥️ FULLSCREEN WIDGET UPDATE
                    const dashTitle = document.getElementById('dash-track-title');
                    if (dashTitle) {
                        document.getElementById('dash-track-title').textContent = data.title;
                        document.getElementById('dash-track-artist').textContent = data.artist;
                        document.getElementById('dash-track-cover').src = data.albumImg;
                        document.getElementById('dash-time-current').textContent = formatMs(data.progress);
                        document.getElementById('dash-time-total').textContent = formatMs(data.duration);
                        document.getElementById('dash-progress').style.width = `${progressPercent}%`;
                    
                        const queueContainer = document.getElementById('dash-queue');
                        if (queueContainer) {
                            if (data.queue && Array.isArray(data.queue) && data.queue.length > 0) {
                                queueContainer.innerHTML = data.queue.slice(0, 4).map(t => `
                                    <div class="queue-item">
                                        <div class="top-track-meta queue-meta">
                                            <div class="top-track-name" style="font-size: 1.1rem; font-weight: 600;">${t.title || 'Unbekannter Titel'}</div>
                                            <div class="top-track-artist" style="font-size: 0.9rem; color: rgba(255,255,255,0.5);">${t.artist || 'Unbekannter Interpret'}</div>
                                        </div>
                                    </div>
                                `).join('');
                            } else if (!data.queue) {
                                queueContainer.innerHTML = '<div style="color:rgba(255,255,255,0.3); font-size:1.1rem;">Warte auf Warteschlangen-Daten...</div>';
                            } else {
                                queueContainer.innerHTML = '<div style="color:rgba(255,255,255,0.3); font-size:1.1rem;">Keine weiteren Titel in der Warteschlange</div>';
                            }
                        }
                    
                        const topContainer = document.getElementById('dash-top-tracks');
                        if (topContainer) {
                            if (data.topTracks && Array.isArray(data.topTracks) && data.topTracks.length > 0) {
                                topContainer.innerHTML = data.topTracks.slice(0, 10).map((t, idx) => `
                                    <div class="top-track-item" style="display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.02); padding: 10px 14px; border-radius: 16px; margin-bottom: 8px;">
                                        <div class="top-track-rank" style="font-size: 1.1rem; font-weight: 700; color: #1db954; width: 25px; text-align: center;">${idx + 1}</div>
                                        ${t.albumImg ? `<img class="top-track-img" src="${t.albumImg}" alt="Cover" style="width: 45px; height: 45px; border-radius: 8px; object-fit: cover;">` : ''}
                                        <div class="top-track-meta" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                                            <div class="top-track-name" style="font-size: 1rem; font-weight: 600; text-overflow: ellipsis; overflow: hidden;">${t.title}</div>
                                            <div class="top-track-artist" style="font-size: 0.85rem; color: rgba(255,255,255,0.5); text-overflow: ellipsis; overflow: hidden;">${t.artist}</div>
                                        </div>
                                    </div>
                                `).join('');
                            } else if (!data.topTracks) {
                                topContainer.innerHTML = '<div style="color:rgba(255,255,255,0.3); font-size:1.1rem; padding: 20px 0;">Warte auf Top-Songs...</div>';
                            }
                        }
                    }
                }

                // --- REMINDER & WIDGET LOGIK ---
                if (data.action === 'show-widget') {
                    const slotA = document.getElementById('widget-slot-a');
                    const slotB = document.getElementById('widget-slot-b');
                    const nextSlot = (currentSlot === 'a') ? document.getElementById('widget-slot-b') : document.getElementById('widget-slot-a');
                    const activeSlot = (currentSlot === 'a') ? document.getElementById('widget-slot-a') : document.getElementById('widget-slot-b');
                    nextSlot.innerHTML = data.html || '';
                    
                    // ⬇️ NEU: Blendet das kleine Spotify-Popup unten rechts sofort aus, wenn ein Widget geöffnet wird
                    document.getElementById('spotify-widget').classList.remove('active');
                    clearTimeout(spotifySemiTimeout); // Stoppt auch den Semi-Countdown-Timer
                    // ⬆️ 

                    if (document.body.classList.contains('widget-active')) {
                        activeSlot.classList.remove('slot-active');
                        nextSlot.classList.add('slot-active');
                    } else {
                        slotA.classList.remove('slot-active'); slotB.classList.remove('slot-active');
                        nextSlot.classList.add('slot-active');
                        document.body.classList.add('widget-active');
                    }
                    currentSlot = (currentSlot === 'a') ? 'b' : 'a';
                }
                
                if (data.action === 'go-idle') { 
                    document.body.classList.remove('widget-active'); 
                    document.getElementById('spotify-widget').classList.remove('active');
                }

                // ⬇️ NEU: STANDBY TOGGLE LOGIK
                if (data.action === 'toggle-standby') {
                    // Falls noch ein großes Widget offen ist, machen wir das sicherheitshalber zu
                    document.body.classList.remove('widget-active');
                    document.getElementById('spotify-widget').classList.remove('active');
                    
                    // Schaltet die CSS-Klasse ein oder aus
                    document.body.classList.toggle('standby-active');
                    console.log("Standby-Modus getoggelt. Aktiv:", document.body.classList.contains('standby-active'));
                }
                // ⬆️

                if (data.action === 'show-reminder') {
                    const level = parseInt(data.stufe) || 1;
                    if (level === 3) {
                        document.getElementById('adhs-message-text').textContent = data.text || 'Aufstehen!';
                        document.getElementById('adhs-overlay').classList.add('active');
                    } else {
                        const rPopup = document.getElementById('reminder-popup');
                        document.getElementById('reminder-content').textContent = data.text || '';
                        rPopup.classList.remove('lvl-1', 'lvl-2');
                        rPopup.classList.add(`lvl-${level}`);
                        document.getElementById('reminder-label-text').textContent = (level === 1) ? '📌 Info' : '🔔 Reminder';
                        showPopup('reminder-popup');
                        setTimeout(() => { hidePopup('reminder-popup'); }, 10000);
                    }
                }

                // --- TIMER ENGINE ---
                if (data.action.startsWith('timer-')) {
                    const action = data.action.replace('timer-', '');
                    const tPopup = document.getElementById('timer-popup');

                    if (action === 'set') {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        tPopup.classList.remove('timer-alarm', 'popup-hide', 'popup-show');
                        document.getElementById('timer-label-text').textContent = "⏱️ Timer";
                        timerTime = parseInt(data.value) || 0;
                        document.getElementById('timer-display').textContent = formatTime(timerTime);
                        showPopup('timer-popup');
                    }
                    else if (action === 'adjust') {
                        let modifier = data.unit === 'min' ? 60 : 1;
                        timerTime += (data.amount * modifier);
                        document.getElementById('timer-display').textContent = formatTime(timerTime);
                        showPopup('timer-popup');
                        if (timerTime > 0) {
                            tPopup.classList.remove('timer-alarm');
                            document.getElementById('timer-label-text').textContent = "⏱️ Timer";
                        }
                    }
                    else if (action === 'start') {
                        tPopup.style.display = 'block';
                        tPopup.style.opacity = '1';
                        tPopup.classList.remove('popup-hide');
                        
                        if (!timerRunning) {
                            timerRunning = true;
                            clearInterval(timerInterval);
                            timerInterval = setInterval(() => {
                                timerTime--;
                                document.getElementById('timer-display').textContent = formatTime(timerTime);
                                tPopup.style.display = 'block';
                                tPopup.style.opacity = '1';
                                
                                if (timerTime <= 0) {
                                    if (!tPopup.classList.contains('timer-alarm')) {
                                        tPopup.classList.add('timer-alarm');
                                    }
                                    document.getElementById('timer-label-text').textContent = "🚨 ABGELAUFEN";
                                } else {
                                    if (tPopup.classList.contains('timer-alarm')) {
                                        tPopup.classList.remove('timer-alarm');
                                        document.getElementById('timer-label-text').textContent = "⏱️ Timer";
                                    }
                                }
                            }, 1000);
                        }
                    }
                    else if (action === 'stop') {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        tPopup.style.display = 'block';
                        tPopup.style.opacity = '1';
                    }
                    else if (action === 'reset') {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        timerTime = 0;
                        
                        tPopup.classList.remove('timer-alarm', 'popup-show');
                        tPopup.classList.add('popup-hide');
                        document.getElementById('timer-display').textContent = "00:00";
                        document.getElementById('timer-label-text').textContent = "⏱️ Timer";
                        
                        setTimeout(() => {
                            if (tPopup.classList.contains('popup-hide')) {
                                tPopup.style.display = 'none';
                                tPopup.classList.remove('popup-hide');
                            }
                        }, 300);
                    }
                }
              
                // --- STOPWATCH LOGIK ---
                if (data.action.startsWith('stopwatch-')) {
                    const action = data.action.replace('stopwatch-', '');
                    if (action === 'start' && !swRunning) {
                        showPopup('stopwatch-popup');
                        swRunning = true;
                        swStartTime = Date.now() - swTime;
                        clearInterval(swInterval);
                        swInterval = setInterval(() => {
                            swTime = Date.now() - swStartTime;
                            document.getElementById('stopwatch-display').textContent = formatStopwatch(swTime);
                        }, 100);
                    }
                    else if (action === 'stop') { clearInterval(swInterval); swRunning = false; }
                    else if (action === 'reset') { clearInterval(swInterval); swRunning = false; swTime = 0; document.getElementById('stopwatch-display').textContent = "00:00.0"; hidePopup('stopwatch-popup'); }
                }
            } catch(err) { console.error(err); }
        };
    </script>
</body>
</html>
