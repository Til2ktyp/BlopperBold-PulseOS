<style>
    .settings-container {
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 30px;
    }
    h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 10px; letter-spacing: -1px; }
    .setting-row {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 20px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    label { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; color: rgba(255,255,255,0.4); letter-spacing: 0.5px; }
    input[type="range"] { width: 100%; accent-color: #0369a1; margin-top: 5px; }
    input[type="text"] {
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 16px;
        border-radius: 12px;
        color: white;
        font-size: 1.1rem;
        font-family: inherit;
    }
    .save-btn {
        background: #ffffff;
        color: #000000;
        border: none;
        padding: 14px;
        border-radius: 14px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .save-btn:active { transform: scale(0.97); }
</style>

<div class="settings-container">
    <div>
        <h1 style="color: #ffffff">System-Einstellungen</h1>
        <p style="color: rgba(255,255,255,0.5)">Passe das Aussehen deines Smart Hub Displays an.</p>
    </div>

    <div class="setting-row">
        <label for="size-slider">Fontgröße der Uhr (<span id="size-val">11</span>rem)</label>
        <input type="range" id="size-slider" min="6" max="16" step="0.5">
    </div>

    <div class="setting-row">
        <label for="location-input">Wetter Standort (Stadtname)</label>
        <input type="text" id="location-input" placeholder="z.B. Pampow oder Schwerin">
    </div>

    <button class="save-btn" onclick="saveSettings()">Änderungen Speichern & Schließen</button>
</div>

<script>
    // Lädt die aktuellen Werte direkt in die Maske
    function initSettingsPage() {
        document.getElementById('size-slider').value = localStorage.getItem('hub-clock-size') || '11';
        document.getElementById('size-val').textContent = localStorage.getItem('hub-clock-size') || '11';
        document.getElementById('location-input').value = localStorage.getItem('hub-city') || 'Pampow';

        // Slider Echtzeit-Anzeige
        document.getElementById('size-slider').oninput = function() {
            document.getElementById('size-val').textContent = this.value;
        };
    }

    // Sucht via Open-Meteo API die Geodaten zur eingegebenen Stadt
    async function saveSettings() {
        const targetCity = document.getElementById('location-input').value.trim();
        const newSize = document.getElementById('size-slider').value;

        // Uhrgröße sofort anwenden
        localStorage.setItem('hub-clock-size', newSize);
        document.documentElement.style.setProperty('--clock-size', newSize + 'rem');

        if(targetCity) {
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(targetCity)}&count=1&language=de&format=json`);
                const geoData = await geoRes.json();
                
                if(geoData.results && geoData.results.length > 0) {
                    const place = geoData.results[0];
                    localStorage.setItem('hub-lat', place.latitude);
                    localStorage.setItem('hub-lon', place.longitude);
                    localStorage.setItem('hub-city', place.name);
                } else {
                    alert("Stadt wurde nicht gefunden. Name richtig geschrieben?");
                }
            } catch(e) {
                console.error("Geocoding Fehler", e);
            }
        }

        // Wetter re-fetchen & schliessen
        fetchWeather();
        goIdle();
    }

    // Falls das Widget gerade erst reinfliegt, direkt triggern
    initSettingsPage();
</script>
