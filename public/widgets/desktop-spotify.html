<div class="spotify-dashboard-layout desktop-spotify-dashboard" data-spotify-widget data-top-limit="10" data-queue-limit="10" data-playlist-limit="12">
    <div class="spotify-dash-left">
        <div class="dash-section-title">Top 10</div>
        <div class="top-tracks-list" id="spotify-top-tracks">
            <div style="color:rgba(255,255,255,0.3); font-size:1.1rem; padding: 10px 0;">Lade Charts...</div>
        </div>
    </div>

    <div class="spotify-dash-right">
        <div class="dash-now-playing desktop-now-playing">
            <img class="dash-cover" id="spotify-track-cover" src="" alt="Cover">
            <div class="dash-meta">
                <div class="dash-title" id="spotify-track-title">Name des Songs</div>
                <div class="dash-artist" id="spotify-track-artist">Artist des Songs</div>
                <div class="dash-timeline-container">
                    <div class="dash-time-stamp" id="spotify-time-current">00:00</div>
                    <div class="dash-progress-bg">
                        <div class="dash-progress-bar" id="dash-progress"></div>
                    </div>
                    <div class="dash-time-stamp" id="spotify-time-total">00:00</div>
                </div>
                <div class="dash-spotify-controls">
                    <button class="spotify-control-btn" type="button" title="Vorheriger Song" data-spotify-previous-track>⏮</button>
                    <button class="spotify-control-btn spotify-toggle-play" type="button" title="Play/Pause" data-spotify-toggle-play>⏯</button>
                    <button class="spotify-control-btn" type="button" title="Nächster Song" data-spotify-next-track>⏭</button>
                </div>
            </div>
        </div>

        <div class="desktop-spotify-grid">
            <div class="dash-box">
                <div class="dash-section-title">Nächste 10</div>
                <div class="queue-list" id="spotify-queue">
                    <div style="color:rgba(255,255,255,0.3); font-size:1.1rem;">Lade Warteschlange...</div>
                </div>
            </div>

            <div class="dash-box">
                <div class="dash-section-title">Playlists</div>
                <div class="playlist-list" id="spotify-playlists">
                    <div style="color:rgba(255,255,255,0.3); font-size:1.1rem;">Lade Playlists...</div>
                </div>
            </div>
        </div>
    </div>
</div>
