<style>
    .weather-container {
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    
    .weather-header {
        text-align: center;
        margin-bottom: 20px;
    }
    
    .weather-header h1 {
        font-size: 2.5rem;
        font-weight: 600;
        margin-bottom: 5px;
    }
    
    .weather-header p {
        color: rgba(255,255,255,0.5);
        font-size: 0.9rem;
    }
    
    .weather-main {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 30px;
        border-radius: 20px;
        text-align: center;
    }
    
    .weather-icon {
        font-size: 4rem;
        margin-bottom: 15px;
    }
    
    .weather-temp {
        font-size: 3rem;
        font-weight: 600;
        margin-bottom: 10px;
    }
    
    .weather-desc {
        font-size: 1.1rem;
        color: rgba(255,255,255,0.7);
        text-transform: capitalize;
    }
    
    .weather-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }
    
    .weather-info-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 20px;
        border-radius: 16px;
        text-align: center;
    }
    
    .weather-info-label {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.5);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
    }
    
    .weather-info-value {
        font-size: 1.5rem;
        font-weight: 600;
    }
    
    .back-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255,255,255,0.2);
        color: rgba(255,255,255,0.9);
        padding: 12px 24px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
    }
    
    .back-btn:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    
    .back-btn:active {
        transform: scale(0.98);
    }
</style>

<div class="weather-container">
    <div class="weather-header">
        <h1>🌤️ Wetter Details</h1>
        <p id="weather-location">Standort wird geladen...</p>
    </div>
    
    <div class="weather-main">
        <div class="weather-icon" id="weather-main-icon">☁️</div>
        <div class="weather-temp" id="weather-main-temp">-- °C</div>
        <div class="weather-desc" id="weather-main-desc">Temperatur wird geladen...</div>
    </div>
    
    <div class="weather-grid">
        <div class="weather-info-card">
            <div class="weather-info-label">Gefühlte Temperatur</div>
            <div class="weather-info-value" id="weather-feels-like">-- °C</div>
        </div>
        
        <div class="weather-info-card">
            <div class="weather-info-label">Luftfeuchte</div>
            <div class="weather-info-value" id="weather-humidity">-- %</div>
        </div>
        
        <div class="weather-info-card">
            <div class="weather-info-label">Windgeschwindigkeit</div>
            <div class="weather-info-value" id="weather-wind">-- km/h</div>
        </div>
        
        <div class="weather-info-card">
            <div class="weather-info-label">Luftdruck</div>
            <div class="weather-info-value" id="weather-pressure">-- hPa</div>
        </div>
        
        <div class="weather-info-card">
            <div class="weather-info-label">Bewölkung</div>
            <div class="weather-info-value" id="weather-cloud">-- %</div>
        </div>
        
        <div class="weather-info-card">
            <div class="weather-info-label">Sicht</div>
            <div class="weather-info-value" id="weather-visibility">-- km</div>
        </div>
    </div>
    
    <button class="back-btn" onclick="closeWidget()">← Zurück</button>
</div>

<script>
    async function loadWeatherDetails() {
        try {
            const lat = localStorage.getItem('hub-lat') || '53.5653';
            const lon = localStorage.getItem('hub-lon') || '11.3653';
            const locName = localStorage.getItem('hub-city') || 'Pampow';
            
            document.getElementById('weather-location').textContent = locName;
            
            // Nutze den Server-Proxy statt direkter API-Aufruf
            const response = await fetch(`http://localhost:3000/api/weather?latitude=${lat}&longitude=${lon}`);
            const data = await response.json();
            
            if (data.current_weather) {
                const weather = data.current_weather;
                const temp = Math.round(weather.temperature);
                
                // Main info
                document.getElementById('weather-main-temp').textContent = temp + '°C';
                document.getElementById('weather-main-desc').textContent = getWeatherDescription(weather.weathercode);
                document.getElementById('weather-main-icon').textContent = getWeatherEmoji(weather.weathercode);
                
                // Wind
                document.getElementById('weather-wind').textContent = Math.round(weather.windspeed) + ' km/h';
                
                // Placeholder für fehlende Daten (diese könnten mit einer erweiterten API gefüllt werden)
                document.getElementById('weather-feels-like').textContent = temp + '°C';
                document.getElementById('weather-humidity').textContent = '--  %';
                document.getElementById('weather-pressure').textContent = '-- hPa';
                document.getElementById('weather-cloud').textContent = '-- %';
                document.getElementById('weather-visibility').textContent = '-- km';
            }
        } catch (e) {
            console.error('[Weather Widget] Fehler:', e);
            document.getElementById('weather-main-desc').textContent = 'Fehler beim Laden';
        }
    }
    
    function getWeatherDescription(code) {
        // WMO Weather interpretation codes
        const descriptions = {
            0: 'Klarer Himmel',
            1: 'Überwiegend klar',
            2: 'Teilweise bewölkt',
            3: 'Übercast',
            45: 'Nebelhart',
            48: 'Raureif Nebel',
            51: 'Leichter Nieselregen',
            53: 'Moderater Nieselregen',
            55: 'Dichter Nieselregen',
            61: 'Leichter Regen',
            63: 'Moderater Regen',
            65: 'Starker Regen',
            71: 'Leichter Schneefall',
            73: 'Moderater Schneefall',
            75: 'Schwerer Schneefall',
            77: 'Schneekörnern',
            80: 'Leichte Regenschauer',
            81: 'Moderate Regenschauer',
            82: 'Starke Regenschauer',
            85: 'Leichte Schneeschauer',
            86: 'Starke Schneeschauer',
            95: 'Gewitter',
            96: 'Gewitter mit Hagel',
            99: 'Gewitter mit Hagel'
        };
        return descriptions[code] || 'Unbekannt';
    }
    
    function getWeatherEmoji(code) {
        if (code === 0) return '☀️';
        if (code <= 3) return '⛅';
        if (code === 45 || code === 48) return '🌫️';
        if (code <= 67) return '🌧️';
        if (code <= 86) return '❄️';
        if (code >= 95) return '⛈️';
        return '☁️';
    }
    
    // Lade Wetter Details beim Widget-Start
    loadWeatherDetails();
</script>
