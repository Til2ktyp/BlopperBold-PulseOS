<div class="spotify-dashboard-layout" data-spotify-widget data-top-limit="5" data-queue-limit="3">
    <div class="spotify-dash-left">
        <div class="dash-section-title">🔥 Deine Top 5</div>
        <div class="top-tracks-list" id="spotify-top-tracks">
            <div style="color:rgba(255,255,255,0.3); font-size:1.1rem; padding: 10px 0;">Lade Charts...</div>
        </div>
    </div>
    
    <div class="spotify-dash-right">
        <div class="dash-now-playing">
            <img class="dash-cover" id="spotify-track-cover" src="" alt="Cover">
            <div class="dash-meta">
                <div class="dash-title" id="spotify-track-title">Name des Songs</div>
                <div class="dash-artist" id="spotify-track-artist">Artist des Songs</div>
                <div class="dash-timeline-container">
                    <div class="dash-time-stamp" id="spotify-time-current">00:00</div>
                    <div class="dash-progress-bg">
                        <div class="dash-progress-bar" id="dash-progress"></div>
                    </div>
                    <div class="dash-time-stamp" id="spotify-time-total">00:00</div>
                </div>
                <div class="dash-spotify-controls">
                    <button class="spotify-control-btn" type="button" title="Vorheriger Song" data-spotify-previous-track>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                    </button>
                    <button class="spotify-control-btn spotify-toggle-play" type="button" title="Play/Pause" data-spotify-toggle-play>
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="spotify-control-btn" type="button" title="Nächster Song" data-spotify-next-track>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="dash-bottom-row">
            <div class="dash-box" style="grid-column: 1 / -1;">
                <div class="dash-section-title">⏭️ Nächste 3 Titel</div>
                <div class="queue-list" id="spotify-queue">
                    <div style="color:rgba(255,255,255,0.3); font-size:1.1rem;">Lade Warteschlange...</div>
                </div>
            </div>
        </div>
    </div>
</div>
