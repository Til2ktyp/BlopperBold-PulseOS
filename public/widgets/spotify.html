<div class="spotify-dashboard-layout">
    <div class="spotify-dash-left">
        <div class="dash-section-title">🔥 Deine Top 5</div>
        <div class="top-tracks-list" id="dash-top-tracks">
            <div style="color:rgba(255,255,255,0.3); font-size:1.1rem; padding: 10px 0;">Lade Charts...</div>
        </div>
    </div>
    
    <div class="spotify-dash-right">
        <div class="dash-now-playing">
            <img class="dash-cover" id="dash-track-cover" src="" alt="Cover">
            <div class="dash-meta">
                <div class="dash-title" id="dash-track-title">Name des Songs</div>
                <div class="dash-artist" id="dash-track-artist">Artist des Songs</div>
                <div class="dash-timeline-container">
                    <div class="dash-time-stamp" id="dash-time-current">00:00</div>
                    <div class="dash-progress-bg">
                        <div class="dash-progress-bar" id="dash-progress"></div>
                    </div>
                    <div class="dash-time-stamp" id="dash-time-total">00:00</div>
                </div>
            </div>
        </div>
        
        <div class="dash-bottom-row">
            <div class="dash-box" style="grid-column: 1 / -1;">
                <div class="dash-section-title">⏭️ Nächste Titel in der Warteschlange</div>
                <div class="queue-list" id="dash-queue">
                    <div style="color:rgba(255,255,255,0.3); font-size:1.1rem;">Lade Warteschlange...</div>
                </div>
            </div>
        </div>
    </div>
</div>
