<div style="padding: 20px; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <h1 style="margin: 0 0 10px 0; font-size: 2.5rem; font-weight: 700;">BlopperBold Pulse OS 26.07</h1>
    <h3 style="margin: 0 0 30px 0; font-size: 1.2rem; font-weight: 500; color: rgba(255,255,255,0.6);"> Updateversion:
        05.22:34</h3>

    <div
        style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 15px; margin-bottom: 30px;">
        <div
            style="font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;">
            Seriennummer:</div>
        <div style="font-size: 1.5rem; font-weight: 700; font-family: 'Courier New', monospace;">{{SERIAL}}</div>
    </div>

    <button id="updateBtn"
        style="width: 100%; padding: 25px 30px; font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 16px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);">
        Update das System
    </button>

    <button id="migrateBtn"
        style="width: 100%; margin-top: 20px; padding: 20px 30px; font-size: 1.3rem; font-weight: 700; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: rgba(255,255,255,0.7); border-radius: 16px; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; font-family: inherit;">
        <span id="migrateBtnText">Lieder auf AfDBook migrieren (Gedrückt halten)</span>
        <div id="migrateProgress" style="position: absolute; bottom: 0; left: 0; height: 5px; width: 0%; background: #38bdf8; transition: width 3s linear;"></div>
    </button>

    <style>
        .log-switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .log-switch input { opacity: 0; width: 0; height: 0; }
        .log-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4a4a4a; transition: .4s; border-radius: 34px; }
        .log-slider:before { position: absolute; content: ''; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .log-switch input:checked + .log-slider { background-color: #667eea; }
        .log-switch input:checked + .log-slider:before { transform: translateX(26px); }
        .log-row { margin-top: 15px; padding: 20px 30px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; display: flex; justify-content: space-between; align-items: center; }
    </style>

    <div class="log-row" style="margin-top: 20px;">
        <div>
            <div style="font-size: 1.2rem; font-weight: 600; color: white;">Spotify "Kein Gerät" Log</div>
            <div style="font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-top: 4px;">Konsole-Spam (Status 204)</div>
        </div>
        <label class="log-switch">
            <input type="checkbox" id="spotifyLogToggle">
            <span class="log-slider"></span>
        </label>
    </div>

    <div class="log-row">
        <div>
            <div style="font-size: 1.2rem; font-weight: 600; color: white;">Spotify History Log</div>
            <div style="font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-top: 4px;">Konsole-Logs für den Wiedergabeverlauf</div>
        </div>
        <label class="log-switch">
            <input type="checkbox" id="spotifyHistoryToggle">
            <span class="log-slider"></span>
        </label>
    </div>

    <div class="log-row">
        <div>
            <div style="font-size: 1.2rem; font-weight: 600; color: white;">Display Log</div>
            <div style="font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-top: 4px;">Konsole-Logs für Display-Zuweisungen</div>
        </div>
        <label class="log-switch">
            <input type="checkbox" id="displayLogToggle">
            <span class="log-slider"></span>
        </label>
    </div>

    <div class="log-row">
        <div>
            <div style="font-size: 1.2rem; font-weight: 600; color: white;">SSE Log</div>
            <div style="font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-top: 4px;">Konsole-Logs für Server-Sent Events</div>
        </div>
        <label class="log-switch">
            <input type="checkbox" id="sseLogToggle">
            <span class="log-slider"></span>
        </label>
    </div>
</div>
